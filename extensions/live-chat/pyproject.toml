[project]
name = "kusa-live-chat"
version = "0.1.0"
description = "Kusă Live Chat Pipecat voice bot (Silero → Whisper → Strata → Piper/Kokoro)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[silero,whisper,openai,websocket,webrtc]>=0.0.68",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
piper = ["pipecat-ai[piper]>=0.0.68"]
kokoro = ["pipecat-ai[kokoro]>=0.0.68"]
all = ["kusa-live-chat[piper,kokoro]"]

[project.scripts]
kusa-live-chat = "live_chat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live_chat"]
