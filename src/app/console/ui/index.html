<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kusă</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <!-- Apply saved theme before paint so the page does not flash the wrong mode. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('monitor.theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <!-- Filled in by the hooks when this page is copied into .kusa/. Null here. -->
  <script id="monitor-bootstrap" type="application/json">null</script>
</head>
<body class="h-full bg-gray-950 text-gray-100 antialiased">
  <div id="root" class="h-full"></div>
  <script type="module" src="/main.jsx"></script>
</body>
</html>
